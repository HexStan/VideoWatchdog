[global]

scan_interval = 0    # 遍历时间间隔（秒），为0则作为一次性脚本运行一次后退出

log_dir = "logs"     # 日志保存目录，默认当前目录
max_log_files = 7    # 最多保留的日志文件数，超过后会删除最早的日志
log_level = "INFO"   # 日志等级，可选: DEBUG, INFO, WARNING, ERROR, CRITICAL

# ==================================================

# 允许配置多组任务，这里是第一组任务
[[tasks]]
name = "Task 1"     # 【选填】任务名称

source_dir = "./source"    # 【必填】需要监听的目录 (源目录)
dest_dir = "./dest"        # 【必填】目标目录
backup_dir = "./backup"    # 【选填】处理完成后源文件的备份目录。若不填且 remove_source = false，则源文件留在原处且永不删除
stable_duration = 5           # 【选填】检测文件大小变化的时间间隔（秒），为0则不检测大小变化

remove_source = false         # 【选填】处理完音视频后直接删除源文件（为 true 时忽略 backup_dir）
source_expired_minutes = 0    # 【选填】仅在 remove_source = true 时可用。如果非0，则将源文件留在 source_dir 超过指定分钟后再删除

failure_count = 3     # 【选填】最多重试次数
fallback_count = 3    # 【选填】FFmpeg 错误回落次数，达到该次数后将使用 ffmpeg_cmd_fallback

# 【必填】要执行的FFmpeg命令，{input} 会被替换为源文件路径，{output} 会被替换为目标目录下的基础文件名（不含扩展名）
# 支持多行命令，执行时会自动合并为单行
ffmpeg_cmd = """
ffmpeg -y \
  -i "{input}" \
  -c:v libx264 \
  -preset fast \
  -crf 23 \
  "{output}-encoded.mp4"
"""

# 【选填】备用 FFmpeg 命令，当 ffmpeg_cmd 失败次数达到 fallback_count 时执行
ffmpeg_cmd_fallback = """
ffmpeg -y \
  -i "{input}" \
  -c:v libx264 \
  -preset medium \
  -crf 28 \
  "{output}-encoded.mp4"
"""

# 【选填】文件过滤与匹配设置
# [tasks.filter]

# 以下三个 pattern 均使用 fnmatch 语法匹配相对于 source_dir 的文件路径（不区分大小写，路径分隔符统一为 "/"），
# 按 include -> exclude -> passthrough 的顺序流水线过滤：
# include_patterns = [ "alpha/*", "bravo*/*", "*charlie*.mp4" ]
#   # 指定要识别的文件。不填或为空则包含所有文件
#   # "alpha/*" 匹配名称为 alpha 的目录下的所有文件（包括所有层级子目录）
#   # "bravo*/*" 匹配名称以 bravo 开头的目录下的所有文件
#   # "*charlie*.mp4" 匹配路径包含 charlie 且以 .mp4 结尾的所有文件
# exclude_patterns = ["*.tmp"]
#   # 匹配到的文件将被跳过
# passthrough_patterns = ["*.txt", "*.log"]
#   # 匹配到的文件不会留在 source_dir，而是直接移动到 dest_dir，且不匹配 file_mtime 以外的其他条件

# file_mtime = 300                         # 文件修改时间阈值（秒），为0则不以修改时间为筛选条件
# size = { min = "0", max = "20GB" }

# duration = { min = "10s", max = "0" }
# video_bitrate = { min = "100K" }
# audio_bitrate = { min = "64K"}
# total_bitrate = { min = "500K", max = "30M" }
# framerate = { min = 24, max = 60 }
# short_side = { min = 720, max = 1080 }
# exclude_video_codecs = ["hevc", "av1"]
# exclude_audio_codecs = ["opus"]

